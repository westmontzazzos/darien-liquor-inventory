<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#EFEFEF;color:#111111;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;}

/* ── Home screen (tile menu) — same structure as Westmont's login/home screen ── */
.Login{min-height:100vh;background:#EFEFEF;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;gap:22px;}
.Login-brand{text-align:center;}
.Login-logo{font-family:Georgia,'Libre Baskerville',serif;font-size:48px;font-weight:700;color:#C8102E;letter-spacing:0.03em;line-height:1;}
.Login-tag{margin-top:10px;font-size:11px;font-weight:700;color:#777777;letter-spacing:0.2em;text-transform:uppercase;}
.Login-grid{display:grid;grid-template-columns:170px 170px;grid-auto-rows:128px;gap:14px;justify-content:center;}
@media (min-width: 700px){
  .Login-grid{grid-template-columns:170px 170px 170px;}
}
.LCard{width:170px;height:128px;background:#FFFFFF;border:2px solid #1B6B3A;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.07);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:border-color 0.15s,box-shadow 0.15s,transform 0.15s;user-select:none;-webkit-tap-highlight-color:transparent;padding:8px;text-align:center;}
.LCard:hover{border-color:#C8102E;box-shadow:0 6px 24px rgba(200,16,46,0.13);transform:translateY(-3px);}
.LCard:active{transform:translateY(0);}
.LCard-role{font-family:Georgia,'Libre Baskerville',serif;font-size:17px;font-weight:700;color:#111111;text-align:center;line-height:1.2;}
.LCard-name{font-size:13px;font-weight:600;font-style:italic;color:#C8102E;text-align:center;}
.ClearDivider{width:170px;height:1px;background:#D9D6CC;margin:4px 0 0;}
.ClearCircle{width:56px;height:56px;border-radius:50%;background:#FFFFFF;border:2px solid #C8102E;color:#C8102E;font-size:11px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.ClearCircle:hover{background:#FDECEA;}

/* ── Per-screen fixed header — each screen renders its own, same classes every time ── */
.H{position:fixed;top:0;left:0;right:0;width:100%;height:60px;background:#C8102E;border-bottom:4px solid #1B6B3A;display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;z-index:200;}
.H-logo{font-family:Georgia,'Libre Baskerville',serif;font-size:20px;font-weight:700;color:#FFFFFF;letter-spacing:0.04em;user-select:none;flex-shrink:0;}
.H-right{margin-left:auto;display:flex;align-items:center;gap:8px;}

.B{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:36px;padding:0 14px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:0.02em;cursor:pointer;border:2px solid transparent;white-space:nowrap;transition:background 0.13s,border-color 0.13s,color 0.13s;-webkit-tap-highlight-color:transparent;}
.B-red{background:#C8102E;border-color:#C8102E;color:#FFFFFF;}.B-red:hover{background:#A50D25;border-color:#A50D25;}
.B-green{background:#1B6B3A;border-color:#1B6B3A;color:#FFFFFF;}.B-green:hover{background:#145430;border-color:#145430;}
.B-outline{background:#FFFFFF;border-color:#E2E2E2;color:#111111;}.B-outline:hover{border-color:#C8102E;color:#C8102E;}
.B-ghost{background:transparent;border-color:rgba(255,255,255,0.5);color:#FFFFFF;}.B-ghost:hover{background:rgba(255,255,255,0.15);border-color:#FFFFFF;}
.B:disabled{opacity:.45;cursor:default;}

.Page{max-width:960px;margin:0 auto;padding:80px 16px 40px;}
@media (min-width: 1200px){
  .Page{max-width:1200px;}
}
.Card{background:#FFFFFF;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,0.08),0 0 0 1px rgba(0,0,0,0.04);margin-bottom:16px;overflow:visible;padding:16px 18px;}
.Card-title{font-family:Georgia,'Libre Baskerville',serif;font-size:15px;font-weight:700;color:#111111;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.Card-sub{font-size:13px;color:#777777;margin-top:-4px;margin-bottom:12px;}
.CatBadge{display:inline-block;background:#FDECEA;color:#C8102E;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:0.06em;}

label{font-size:12px;color:#777777;font-weight:600;display:block;margin-bottom:4px;}
select, textarea, input[type=file]{
  width:100%;font-family:inherit;font-size:13px;border:2px solid #E2E2E2;border-radius:6px;
  padding:8px 10px;background:#fff;color:#111111;
}
select:focus, textarea:focus{outline:none;border-color:#C8102E;}
textarea{min-height:160px;font-family:'Courier New',monospace;font-size:12.5px;resize:vertical;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.row > div{flex:1;min-width:200px;}
.btnrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.detect{font-size:12px;margin-top:8px;color:#777777;}
.detect b{color:#1B6B3A;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 10px;border-bottom:1px solid #F5F5F5;text-align:left;}
th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#777777;background:#F5F5F5;border-bottom:2px solid #E2E2E2;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#fafafa;}
.qty{text-align:right;font-variant-numeric:tabular-nums;}
.countinput{width:100px;text-align:right;padding:0 8px;height:34px;font-size:13px;font-weight:600;border:2px solid #E2E2E2;border-radius:6px;color:#111111;}
.countinput:focus{outline:none;border-color:#C8102E;}

.flags{background:#FDECEA;border:1px solid #F5C0C8;border-radius:6px;padding:10px 14px;margin-top:12px;}
.flags .flagline{font-size:12.5px;color:#C8102E;padding:2px 0;font-family:'Courier New',monospace;}
.flags h3{margin:0 0 6px;font-size:12px;color:#C8102E;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.empty{color:#777777;font-size:13px;font-style:italic;padding:8px 0;}
code{background:#F5F5F5;padding:1px 5px;border-radius:3px;font-size:12px;}
.pos{color:#1B6B3A;font-weight:700;}
.neg{color:#C8102E;font-weight:700;}

/* ── Print: hide the whole interactive screen, show only the dedicated print sheet ── */
@media print{
  .no-print, .H, .Card, .Page{display:none!important;}
  body,html{background:#FFFFFF!important;height:auto!important;overflow:visible!important;}
  .print-show{display:block!important;}
  .print-show table{width:100%;table-layout:fixed;}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  @page{margin:0.6in;size:letter portrait;}
}
</style>

function parseSalesByItemLines(text) {
  const rows = [];
  const lineRe = /^(\d{4,9})\s+(.+?)\s+(\d+)\s+([\d,]+\.\d{2})\s+([\d.]+)$/;
  for (const line of text.split("\n")) {
    const m = line.trim().match(lineRe);
    if (m) rows.push({ plu: m[1], name: m[2], qty: parseInt(m[3]) });
  }
  return rows;
}
function parseModifierLines(text) {
  const rows = [];
  const lineRe = /^(\d{4,5})\s+(.+?)\s+(\d+)$/;
  for (const line of text.split("\n")) {
    const m = line.trim().match(lineRe);
    if (m && m[2] !== "Total") rows.push({ plu: m[1], name: m[2], qty: parseInt(m[3]) });
  }
  return rows;
}
function parseSizesSoldLiquor(text) {
  const rows = [];
  const lineRe = /^(\d{4,5})\s+(.+?)\s+(Neat|Rocks|Short|Tall|Double|Shot|Mixed|Martini)\s+(\d+)\s+([\d,]+\.\d{2})$/;
  for (const line of text.split("\n")) {

function detectReportType(text) {
  if (/Category:\s*Beer\b/i.test(text)) return "beer";
  if (/Category:\s*Bucket Bottles/i.test(text)) return "bucket_bottles";
  if (/Category:\s*Bucket/i.test(text)) return "bucket";
  if (/Category:\s*Carryout/i.test(text)) return "carryout";
  if (/Category:\s*Liquor/i.test(text)) return "liquor";
  if (/Category:\s*Wine/i.test(text)) return "wine";
  if (/Category:\s*High Noon/i.test(text)) return "highnoon";
  if (/Category:\s*Vodkade/i.test(text) || /Vodkade SF/i.test(text)) return "vodkade";
  if (/Category:\s*Specialty/i.test(text)) return "specialty";
  if (/Category:\s*Non-Alcoholic/i.test(text)) return "nonalcoholic";

  // Fallback for single-product report exports. Real Speedline exports for a
  // single PLU carry the product name in a "PLU: NNNN (Name)" header line —
  // NOT in the Category line, which just says "All" or is blank for these.
  // Two shapes exist: "Sales By Item" (has $ amounts) and "Modifier Usage"
  // (PLU + quantity only, no dollar figure) — route each appropriately.
  const pluHeaderMatch = text.match(/PLU:\s*\d+\s*\(([^)]+)\)/i);
  if (pluHeaderMatch) {
    const hdrName = pluHeaderMatch[1].trim().toLowerCase().replace(/[^a-z0-9]/g, "");
    const fuzzyMatch = (mapObj) => Object.values(mapObj).some(name => {
      const n = name.toLowerCase().replace(/[^a-z0-9]/g, "");
      return n === hdrName || n.includes(hdrName) || hdrName.includes(n);
    });
    const isModifierUsage = /Modifier Usage/i.test(text);
    if (!isModifierUsage) {
      if (fuzzyMatch(PLU_MAPS.beer) || fuzzyMatch(PLU_MAPS.keg)) return "beer";
      if (fuzzyMatch(PLU_MAPS.nonalcoholic)) return "nonalcoholic";
    } else {
      if (fuzzyMatch(PLU_MAPS.vodkade)) return "vodkade";
      if (fuzzyMatch(PLU_MAPS.nonalcoholic)) return "nonalcoholic_modifier";
      if (fuzzyMatch(PLU_MAPS.highnoon)) return "highnoon";
    }
  }
  return null;
}

/* ───────────────────────── CATEGORY PROCESSORS ─────────────────────────
   These turn parsed rows into bottle/keg/unit-equivalent totals using
   PLU_MAPS. Everything not found in PLU_MAPS is flagged rather than
   guessed at — that flag list doubles as a worksheet for building out
   Darien's PLU map.
   ───────────────────────────────────────────────────────────────────── */
async function extractPdfText(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let fullText = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    // Sort all text items top-to-bottom, then left-to-right, and cluster items into a
    // row if they're within a small Y tolerance of each other. The previous version
    // grouped by Math.round(y) exactly - but different columns in a table (numbers vs
    // text) can render at slightly different sub-pixel Y positions, so an exact-integer
    // group could split one real row into two fragments, neither of which matches the
    // parser regex on its own. This silently dropped whole rows (e.g. Modelo, Coors
    // Light, Miller Lite) with no error or flag, since a row that never became one
    // line just never gets tested against the regex at all.
    const items = content.items.map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5] }))
      .sort((a, b) => (b.y - a.y) || (a.x - b.x));
    const Y_TOLERANCE = 2.5;
    const rows = [];
    for (const it of items) {
      let row = rows.find(r => Math.abs(r.y - it.y) <= Y_TOLERANCE);
      if (!row) { row = { y: it.y, items: [] }; rows.push(row); }
      row.items.push(it);
    }
    fullText += rows.map(r => r.items.sort((a, b) => a.x - b.x).map(it => it.str).join(" ")).join("\n") + "\n";
  }
  return fullText;
}

function processBeer(text) {
  const rows = parseSalesByItemLines(text);
  const bottles = {}, kegs = {}, flags = [];
  for (const r of rows) {
    if (BEER_SUPPRESS.has(r.plu)) continue;
    if (PLU_MAPS.keg[r.plu]) kegs[PLU_MAPS.keg[r.plu]] = (kegs[PLU_MAPS.keg[r.plu]] || 0) + r.qty;

    else flags.push(`Unmapped Beer PLU ${r.plu} ("${r.name}", qty ${r.qty})`);
  }
  return { bottles, kegs, flags };
}
function processModifierCategory(mapName, text) {
  const rows = parseModifierLines(text);

    if (!item) { flags.push(`Unmapped ${mapName} PLU ${r.plu} ("${r.name}", qty ${r.qty})`); continue; }
    items[item] = (items[item] || 0) + r.qty;

    if (!item) { flags.push(`Unmapped ${mapName} PLU ${r.plu} ("${r.name}", qty ${r.qty})`); continue; }

function processLiquor(text) {
  const rows = parseSizesSoldLiquor(text);
  const ozByItem = {}, flags = [];
  for (const r of rows) {
    const item = PLU_MAPS.liquor[r.plu];
    if (!item) { flags.push(`Unmapped Liquor PLU ${r.plu} ("${r.name}")`); continue; }
    ozByItem[item] = (ozByItem[item] || 0) + LIQUOR_POUR_OZ[r.size] * r.qty;

  const bottles = {};
  for (const [item, oz] of Object.entries(ozByItem)) bottles[item] = Math.round((oz / LIQUOR_BOTTLE_OZ) * 100) / 100;

const SPECIALTY_NAME_FIX = { "Expresso Martini": "Espresso Martini", "Sambucca": "Sambuca", "Kahlúa": "Kahlua" };
const SPECIALTY_STRAIGHT_POUR = {
    "Baileys": { ingredient: "Baileys", oz: 1.5 },
    "Disaranno Amaretto 1L": { ingredient: "Disaranno Amaretto 1L", oz: 1.5 },
    "Jack Fire": { ingredient: "Jack Fire", oz: 1.5 },
    "Jack Honey": { ingredient: "Jack Honey", oz: 1.5 },
    "Kahlua": { ingredient: "Kahlua", oz: 1.5 },
    "Sambuca": { ingredient: "Sambuca", oz: 1.5 },
};
function processSpecialty(text) {
    const rows = parseSalesByItemLines(text);
    const recipeMap = {};
    for (const r of RECIPE_DATABASE) {
        if (r.tracked !== "Yes") continue;
        if (!recipeMap[r.drink]) recipeMap[r.drink] = [];
        recipeMap[r.drink].push({ ingredient: r.maps_to_master_item, oz: r.oz });
    }
    const ozByItem = {}, flags = [];
    function addDepletion(ingredient, amount) { ozByItem[ingredient] = (ozByItem[ingredient] || 0) + amount; }
    for (const row of rows) {
        if (SPECIALTY_STRAIGHT_POUR[row.name]) {
            const { ingredient, oz } = SPECIALTY_STRAIGHT_POUR[row.name];
            addDepletion(ingredient, oz * row.qty);
            continue;
        }
        const drinkName = SPECIALTY_NAME_FIX[row.name] || row.name;
        const recipe = recipeMap[drinkName];
        if (!recipe) { flags.push(`No recipe found for "${row.name}" (qty ${row.qty}) - add it to the Recipe Database or check spelling`); continue; }
        for (const ing of recipe) addDepletion(ing.ingredient, ing.oz * row.qty);
    }
    const bottles = {};
    for (const [item, oz] of Object.entries(ozByItem)) bottles[item] = Math.round((oz / LIQUOR_BOTTLE_OZ) * 100) / 100;
    return { bottles, flags };
}

const WINE_SUPPRESS = new Set(["2876"]); // Red Sangria — specialty cocktail, not a straight wine pour
// LaMarca Split is a single-serve mini-bottle (187ml), rung up at the register as a
// "Glass" for convenience - but it is NOT a glass poured from a larger bottle, so running
// it through the standard glass-to-bottle ratio (WINE_GLASSES_PER_BOTTLE, built for a
// 750ml bottle poured into ~5oz glasses) is the wrong math entirely. Every sale is one
// whole unit, full stop - no oz conversion needed. (Note: an earlier attempted fix here
// tried to solve this by changing the bottle-oz constant instead - that was a no-op,
// since multiplying and then dividing by the same constant always cancels out regardless
// of its value. This is the actual fix.)
const WINE_UNIT_SOLD = new Set(["LaMarca Split"]);
function processWine(text) {
  const rows = parseSizesSoldWine(text);
  const ozByItem = {}, unitByItem = {}, flags = [];
  for (const r of rows) {
    if (WINE_SUPPRESS.has(r.plu)) continue;
    const item = PLU_MAPS.wine[r.plu];
    if (!item) { flags.push(`Unmapped Wine PLU ${r.plu} ("${r.name}", qty ${r.qty})`); continue; }
    if (WINE_UNIT_SOLD.has(item)) { unitByItem[item] = (unitByItem[item] || 0) + r.qty; continue; }
    const oz = r.size === "Bottle" ? r.qty * WINE_BOTTLE_OZ : (r.qty / WINE_GLASSES_PER_BOTTLE) * WINE_BOTTLE_OZ;
    ozByItem[item] = (ozByItem[item] || 0) + oz;
  }
  const bottles = {};
  for (const [item, oz] of Object.entries(ozByItem)) bottles[item] = Math.round((oz / WINE_BOTTLE_OZ) * 100) / 100;
  for (const [item, qty] of Object.entries(unitByItem)) bottles[item] = qty;
  return { bottles, flags };
}
function processCarryout(text) {
  const rows = parseSalesByItemLines(text);
  const items = {}, flags = [];
  for (const r of rows) {
    const mapping = PLU_MAPS.carryout[r.plu];
    if (!mapping) { flags.push(`Unmapped Carryout PLU ${r.plu} ("${r.name}", qty ${r.qty})`); continue; }
    items[mapping.item] = (items[mapping.item] || 0) + r.qty * (mapping.mult || 1);
  }
  return { items, flags };
}

function runParser(reportType, text) {
  switch (reportType) {
    case "beer": {
      const { bottles, kegs, flags } = processBeer(text);
      return { bottles, kegs, flags };
    }
    case "liquor": return processLiquor(text);
    case "wine": return processWine(text);
    case "carryout": { const { items, flags } = processCarryout(text); return { bottles: items, flags }; }
    case "bucket": { const { items, flags } = processModifierCategory("bucket", text); return { bottles: items, flags }; }
    case "bucket_bottles": { const { items, flags } = processModifierCategory("bucket", text); return { bottles: items, flags }; }
    case "highnoon": { const { items, flags } = processModifierCategory("highnoon", text); return { bottles: items, flags }; }
    case "vodkade": { const { items, flags } = processModifierCategory("vodkade", text); return { bottles: items, flags }; }
    case "nonalcoholic": { const { items, flags } = processSimpleItemCategory("nonalcoholic", text); return { bottles: items, flags }; }
    case "nonalcoholic_modifier": { const { items, flags } = processModifierCategory("nonalcoholic", text); return { bottles: items, flags }; }
    case "specialty": return processSpecialty(text);
    default: return { bottles: {}, flags: ["Couldn't detect a report category — paste the report exactly as exported from Speedline (including the 'Category:' header line), or pick a category manually."] };
  }
}

function combineSalesSession(session) {
  const combined = {};
  for (const entry of session) {
    if (entry.result.bottles) for (const [k, v] of Object.entries(entry.result.bottles)) combined[k] = (combined[k] || 0) + v;
    if (entry.result.kegs) for (const [k, v] of Object.entries(entry.result.kegs)) combined[k] = (combined[k] || 0) + v / poursPerKeg(k);
  }
  return combined;
}

// Products that have zero PLU coverage anywhere in PLU_MAPS — these can never
// show up in Speedline sales no matter what's actually sold, until a PLU is added.
function getProductsMissingPLU(master) {
  const covered = new Set();
  for (const cat of ["beer", "keg", "liquor", "wine", "bucket", "nonalcoholic"]) {
    for (const name of Object.values(PLU_MAPS[cat])) covered.add(name);
  }
  for (const info of Object.values(PLU_MAPS.carryout)) covered.add(info.item);
  return master.filter(p => !covered.has(p.name));
}

function groupMasterByLocation(master) {
  const groups = {};
  for (const loc of LOCATIONS) groups[loc] = [];
  for (const p of master) for (const loc of p.locations) groups[loc].push(p);
  for (const loc of LOCATIONS) groups[loc].sort((a, b) => orderGuideRank(a.name) - orderGuideRank(b.name));
  return groups;
}

// Every displayed number that comes from a calculation (not raw user typing)
// goes through this — rounds to 2 decimal places, no floating-point noise.
function fmt2(n) {
  if (n === null || n === undefined || n === "") return "";
  return Math.round(n * 100) / 100;
}

function sumStockForProduct(stock, name) {
  const s = stock[name];
  if (!s) return 0;
  return (s.front || 0) + (s.bar || 0) + (s.office || 0) + (s.outside || 0);
}

  function handleParse() {
    const type = manualType || detected;
    if (!type) return;
    if (session.length > 0) {
      const proceed = window.confirm("This will clear the current Speedline data and replace it with this report. Continue?");
      if (!proceed) return;
    }
    const result = runParser(type, rawText);
    setSession([{ label: REPORT_LABELS[type] || type, type, result, addedAt: new Date().toLocaleTimeString() }]);
    setRawText(""); setDetected(null); setManualType("");
  }
  function clearSession() { setSession([]); }

  // Mirrors Westmont's handleFiles: select every report PDF at once,
  // auto-detect each file's category, hold them until Parse All is clicked.
  async function handleFiles(e) {
    const fileList = Array.from(e.target.files);
    const found = {};
    const unrecognized = [];
    for (const file of fileList) {
      let text;
      if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) text = await extractPdfText(file);
      else text = await file.text();
      const type = detectReportType(text);
      // Previously this line was `found[type] = { text, name: file.name }`, which OVERWRITES
      // any earlier file already detected as this same category - if your Beer report spans
      // more than one file/page, only the last one survived and everything else was silently
      // dropped. This is very likely why beer numbers looked complete in one test and badly
      // undercounted in another - it depended on exactly which files got processed last.
      if (type) {
        if (found[type]) {
          found[type] = { text: found[type].text + "\n" + text, name: found[type].name + " + " + file.name };
        } else {
          found[type] = { text, name: file.name };
        }
      }
      else unrecognized.push(file.name);
    }
    setDetectedFiles(found);
    setUnrecognizedNames(unrecognized);
  }
  function mergeInto(target, source) {
    for (const [k, v] of Object.entries(source)) target[k] = (target[k] || 0) + v;
  }
  function runBatchParse() {
    const types = Object.keys(detectedFiles);
    if (types.length === 0) return;
    if (session.length > 0) {
      const proceed = window.confirm("This will clear the current Speedline data and replace it with what's in these files. Continue?");
      if (!proceed) return;
    }
    const combinedBottles = {}, combinedKegs = {};
    const allFlags = [];
    const typesUsed = [];
    for (const [type, info] of Object.entries(detectedFiles)) {
      const result = runParser(type, info.text);
      if (result.bottles) mergeInto(combinedBottles, result.bottles);
      if (result.kegs) mergeInto(combinedKegs, result.kegs);
      if (result.flags) allFlags.push(...result.flags);
      typesUsed.push(REPORT_LABELS[type] || type);
    }
    setSession([{
      label: "Batch Upload (" + typesUsed.join(", ") + ")",
      type: "batch",
      result: { bottles: combinedBottles, kegs: combinedKegs, flags: allFlags },
      addedAt: new Date().toLocaleTimeString()
    }]);
    setDetectedFiles({});
    setUnrecognizedNames([]);
    if (fileRef.current) fileRef.current.value = "";
  }

  const totals = { bottles: {}, kegs: {} };
  const allFlags = [];
  for (const entry of session) {
    if (entry.result.bottles) for (const [k, v] of Object.entries(entry.result.bottles)) totals.bottles[k] = (totals.bottles[k] || 0) + v;
    if (entry.result.kegs) for (const [k, v] of Object.entries(entry.result.kegs)) totals.kegs[k] = (totals.kegs[k] || 0) + v;
    if (entry.result.flags) for (const f of entry.result.flags) allFlags.push(`[${entry.label}] ${f}`);
  }
  const activeType = manualType || detected;
  const detectedTypeKeys = Object.keys(detectedFiles);
  const lastParsedAt = session.length > 0 ? session[session.length - 1].addedAt : null;

  return h(React.Fragment, null,
    h(ScreenHeader, { onHome }),
    h("main", { className: "Page" },
    h("div", { className: "Card", style: { background: lastParsedAt ? "#EFF8F1" : "#FDECEA", border: lastParsedAt ? "1px solid #1B6B3A" : "1px solid #F5C0C8" } },
      h("div", { style: { fontSize: 12, fontWeight: 700, color: lastParsedAt ? "#1B6B3A" : "#C8102E" } },
        lastParsedAt ? ("✓ Session has data — last parsed at " + lastParsedAt + " (" + session.length + " batch" + (session.length === 1 ? "" : "es") + ")") : "⚠ No session data yet — nothing has been parsed since the last clear"
      )
    ),
    h("div", { className: "Card" },
      h("div", { className: "Card-title" }, "Upload Reports"),
      h("div", { className: "empty" }, "Select all of this week's Speedline report PDFs at once — each file's category is auto-detected."),
      h("input", { type: "file", accept: "application/pdf,.txt", multiple: true, ref: fileRef, onChange: handleFiles }),
      detectedTypeKeys.length > 0 && h("div", { style: { marginTop: 12 } },
        h("div", { className: "detect" }, h("b", null, "Detected: "),
          detectedTypeKeys.map(k => `${REPORT_LABELS[k] || k} (${detectedFiles[k].name})`).join(", ")
        )
      ),
      unrecognizedNames.length > 0 && h("div", { className: "flags", style: { marginTop: 10 } },
        h("h3", null, "Could not identify (" + unrecognizedNames.length + ")"),
        unrecognizedNames.map(n => h("div", { key: n, className: "flagline" }, n))
      ),
      detectedTypeKeys.length > 0 && h("div", { className: "btnrow" },
        h("button", { className: "B B-red", onClick: runBatchParse }, "Parse All Files & Add to Session")
      )
    ),
    h("div", { className: "Card" },
      h("div", { className: "Card-title" }, "...or paste one report at a time"),
      h("div", { className: "row" },
        h("div", null,
          h("label", null, "Paste report text"),
          h("textarea", {
            placeholder: "Paste the Speedline report exactly as exported (include the 'Category:' line so the type can be auto-detected)...",
            value: rawText, onChange: e => handlePasteChange(e.target.value)
          })
        )
      ),
      h("div", { className: "row", style: { marginTop: 10 } },
        h("div", null,
          h("label", null, "Report category"),
          h("select", { value: manualType, onChange: e => setManualType(e.target.value) },
            h("option", { value: "" }, detected ? `Auto-detected: ${REPORT_LABELS[detected] || detected}` : "Auto-detect (or choose manually)"),
            Object.keys(REPORT_LABELS).map(k => h("option", { key: k, value: k }, REPORT_LABELS[k]))
          )
        )
      ),
      rawText.trim() && h("div", { className: "detect" },
        activeType ? h("span", null, "Will parse as: ", h("b", null, REPORT_LABELS[activeType] || activeType))
                   : h("span", null, "No category detected yet — paste a full report or pick one manually.")
      ),
      h("div", { className: "btnrow" },
        h("button", { className: "B B-red", onClick: handleParse, disabled: !rawText.trim() || !activeType }, "Parse & Add to Session")
      )
    ),
    h("div", { className: "Card" },
      h("div", { className: "Card-title" }, "Session Totals"),
      Object.keys(totals.bottles).length === 0 && Object.keys(totals.kegs).length === 0
        ? h("div", { className: "empty" }, "No parsed data yet — add reports above.")
        : h(React.Fragment, null,
            Object.keys(totals.bottles).length > 0 && h("table", null,
              h("thead", null, h("tr", null, h("th", null, "Item"), h("th", { style: { textAlign: "right" } }, "Bottle/Unit-Equiv Qty"))),
              h("tbody", null,
                Object.entries(totals.bottles).sort((a, b) => a[0].localeCompare(b[0])).map(([k, v]) =>
                  h("tr", { key: k }, h("td", null, k), h("td", { className: "qty" }, fmt2(v)))
                )
              )
            ),
            Object.keys(totals.kegs).length > 0 && h("div", { style: { marginTop: 14 } },
              h("table", null,
                h("thead", null, h("tr", null, h("th", null, "Keg Item"), h("th", { style: { textAlign: "right" } }, "Pours Sold"))),
                h("tbody", null,
                  Object.entries(totals.kegs).sort((a, b) => a[0].localeCompare(b[0])).map(([k, v]) =>
                    h("tr", { key: k }, h("td", null, k), h("td", { className: "qty" }, fmt2(v)))
                  )
                )
              )
            )
          ),
      allFlags.length > 0 && h("div", { className: "flags" },
        h("h3", null, "Unmapped PLUs (" + allFlags.length + ")"),
        allFlags.map((f, i) => h("div", { key: i, className: "flagline" }, f))
      )
    ),
    session.length > 0 && h("div", { className: "Card" },
      h("div", { className: "Card-title" }, "Reports Added This Session"),
      h("table", null,
        h("thead", null, h("tr", null, h("th", null, "Time"), h("th", null, "Report"), h("th", null, "Items Found"), h("th", null, "Flags"))),

            h("td", null, (e.result.flags || []).length)
          ))
        )
      )
    )
  ));
}

function ManualVsSpeedlineScreen({ master, manualCounts, setManualCounts, session, onHome }) {
  const salesTotals = combineSalesSession(session);
  const sorted = [...master].sort((a, b) => orderGuideRank(a.name) - orderGuideRank(b.name));
  const [uploadMsg, setUploadMsg] = useState(null);
  const fileRef = useRef(null);

  async function handleOrderGuideUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheetName = wb.SheetNames.find(n => n.trim().toLowerCase() === "order guide") || wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      const data = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      // Header row: Product Name | Type | Ven | Order | Total | Last Week | Received | Sold | Difference | Par | Order
      // "Sold" is column index 7 (0-based) — same layout as the real Order Guide tab.
      const newCounts = {};
      let matched = 0, skipped = 0;
      for (let i = 1; i < data.length; i++) {
        const row = data[i];
        if (!row || !row[0]) continue;
        const name = String(row[0]).trim();
        const sold = row[7];
        if (typeof sold === "number") { newCounts[name] = sold; matched++; }
        else skipped++;
      }
      setManualCounts(newCounts); // full replace, not merge — fresh snapshot each upload
      setUploadMsg(`Loaded "${sheetName}" — ${matched} products with a Sold value, ${skipped} blank/skipped. Replaced all previous Manual values.`);
    } catch (err) {
      setUploadMsg("Couldn't read that file — make sure it's the Order Guide .xlsx with a Sold column. (" + err.message + ")");
    }
    if (fileRef.current) fileRef.current.value = "";
  }

  const rows = sorted.map(p => {
    const manual = manualCounts[p.name] ?? null;
    const parser = salesTotals[p.name] || 0;
    const diff = manual === null ? null : Math.round((parser - manual) * 100) / 100;
    return { name: p.name, category: p.category, manual, parser, diff };
  });

  return h(React.Fragment, null,
    h(ScreenHeader, { onHome, onPrint: () => window.print() }),
    h(ManualVsSpeedlinePrintSheet, { rows }),
    h("main", { className: "Page" },
      h("div", { className: "btnrow", style: { marginBottom: 12 } },
        h("button", { className: "B B-outline", onClick: () => fileRef.current && fileRef.current.click() }, "📤 Upload"),
        h("input", { type: "file", accept: ".xlsx", ref: fileRef, onChange: handleOrderGuideUpload, style: { display: "none" } }),
        uploadMsg && h("span", { className: "detect", style: { marginLeft: 10 } }, uploadMsg)
      ),
      h("div", { className: "Card", style: { padding: "16px 8px" } },
        h("table", { style: { tableLayout: "fixed", width: "100%" } },
          h("thead", null, h("tr", null,
            h("th", { style: { width: "34%", padding: "8px 4px" } }, "Item"),
            h("th", { style: { width: "22%", textAlign: "right", padding: "8px 4px" } }, "Manual"),
            h("th", { style: { width: "22%", textAlign: "right", padding: "8px 4px" } }, "Parser"),
            h("th", { style: { width: "22%", textAlign: "right", padding: "8px 4px" } }, "Diff")
          )),
          h("tbody", null,
            rows.map(r => h("tr", { key: r.name },
              h("td", { style: { padding: "6px 4px", verticalAlign: "top" } },
                h("div", null, r.name),
                h("span", { className: "CatBadge", style: { marginTop: 3, display: "inline-block" } }, r.category)
              ),
              h("td", { className: "qty", style: { padding: "6px 4px", verticalAlign: "top" } }, r.manual !== null ? fmt2(r.manual) : ""),
              h("td", { className: "qty", style: { padding: "6px 4px", verticalAlign: "top" } }, r.parser ? fmt2(r.parser) : ""),
              h("td", {
                className: "qty", style: {
                  padding: "6px 4px", verticalAlign: "top",
                  color: r.diff === null ? undefined : (Math.abs(r.diff) > 0.01 ? "#C8102E" : "#1B6B3A"),
                  fontWeight: r.diff === null ? undefined : 600
                }
              }, r.diff === null ? "" : r.diff)
            ))
          )
        )
      )
    )
  );
}

/* ───────────────────────── DEPLETION REPORT SCREEN ───────────────────────── */
function DepletionScreen({ master, stock, received, lastWeek, session, onCloseWeek, onHome }) {
  const salesTotals = combineSalesSession(session);
  const masterNames = new Set(master.map(p => p.name));
  const sorted = [...master].sort((a, b) => orderGuideRank(a.name) - orderGuideRank(b.name));

  const rows = sorted.map(p => {
    const current = sumStockForProduct(stock, p.name);
    const lastWk = lastWeek[p.name] || 0;
    const rec = received[p.name] || 0;
    const sales = salesTotals[p.name] || 0;
    const depletion = lastWk + rec - current;
    const variance = sales - depletion;
    return { name: p.name, category: p.category, lastWk, rec, current, depletion, sales, variance };
  });

  const unrecognized = Object.entries(salesTotals).filter(([name]) => !masterNames.has(name));

  return h(React.Fragment, null,
    h(ScreenHeader, { onHome }),
    h("main", { className: "Page" },
    h("div", { className: "Card" },
      h("div", { className: "Card-title" }, "Depletion Report"),
      h("div", { className: "empty" },
        "Depletion = Last Week + Received − Current Count. Variance = Sales − Depletion. Negative = short, positive = surplus, zero = even."
      )
    ),
    h("div", { className: "Card" },
      h("table", null,
        h("thead", null, h("tr", null,
          h("th", null, "Product"), h("th", null, "Cat"),
          h("th", { style: { textAlign: "right" } }, "Last Wk"),
          h("th", { style: { textAlign: "right" } }, "Received"),
          h("th", { style: { textAlign: "right" } }, "Current"),
          h("th", { style: { textAlign: "right" } }, "Depletion"),
          h("th", { style: { textAlign: "right" } }, "Sales"),
          h("th", { style: { textAlign: "right" } }, "Variance")
        )),
        h("tbody", null,
          rows.map(r => h("tr", { key: r.name },
            h("td", null, r.name),
            h("td", null, r.category),
            h("td", { className: "qty" }, r.lastWk ? fmt2(r.lastWk) : ""),
            h("td", { className: "qty" }, r.rec ? fmt2(r.rec) : ""),
            h("td", { className: "qty" }, r.current ? fmt2(r.current) : ""),
            h("td", { className: "qty" }, Math.round(r.depletion * 100) / 100),
            h("td", { className: "qty" }, Math.round(r.sales * 100) / 100),
            h("td", { className: "qty", style: { color: r.variance < -0.01 ? "#C8102E" : r.variance > 0.01 ? "#B36A00" : "#1B6B3A", fontWeight: 600 } },
              Math.round(r.variance * 100) / 100)
          ))
        )
      )
    ),
    unrecognized.length > 0 && h("div", { className: "Card" },
      h("div", { className: "Card-title" }, "Unrecognized Sales Items (" + unrecognized.length + ")"),
      h("div", { className: "flags" },
        h("h3", null, "Sales recorded under a name that doesn't match any Master Guide product"),
        unrecognized.map(([name, qty]) => h("div", { key: name, className: "flagline" }, `${name} — qty ${Math.round(qty * 100) / 100}`))
      )
    ),
    h("div", { className: "Card" },
      h("div", { className: "Card-title" }, "Close Week"),
      h("div", { className: "empty" }, "Archives current stock as next week's \"Last Week,\" then clears Received and the Speedline session for the new week. This does not persist anywhere yet — refreshing the page loses everything."),
      h("div", { className: "btnrow" }, h("button", { className: "B B-green", onClick: onCloseWeek }, "Close Week & Start New"))
    )
  ));
}

/* ───────────────────────── APP SHELL ───────────────────────── */
const STORAGE_KEY = "darien_liquor_state_v1";

function App() {
  const [screen, setScreen] = useState("home");
  const [stock, setStock] = useState({});
  const [received, setReceived] = useState({});
  const [lastWeek, setLastWeek] = useState({});
  const [session, setSession] = useState([]);
  const [manualCounts, setManualCounts] = useState({});
  const [weekCount, setWeekCount] = useState(1);
  const [loaded, setLoaded] = useState(false);

  // Load saved state once on mount (device-local only — see note in chat).
  useEffect(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved.stock) setStock(saved.stock);
        if (saved.received) setReceived(saved.received);
        if (saved.lastWeek) setLastWeek(saved.lastWeek);
        if (saved.session) setSession(saved.session);
        if (saved.manualCounts) setManualCounts(saved.manualCounts);
        if (saved.weekCount) setWeekCount(saved.weekCount);
      }
    } catch (e) { console.error("Failed to load saved data:", e); }
    setLoaded(true);
  }, []);

  // Save on every change, once initial load has completed (avoids overwriting saved data with blank initial state).
  useEffect(() => {
    if (!loaded) return;
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ stock, received, lastWeek, session, manualCounts, weekCount }));
    } catch (e) { console.error("Failed to save data:", e); }
  }, [loaded, stock, received, lastWeek, session, manualCounts, weekCount]);

  function closeWeek() {
    const newLastWeek = {};
    for (const p of MASTER_DATA) newLastWeek[p.name] = sumStockForProduct(stock, p.name);
    setLastWeek(newLastWeek);
    setStock({});
    setReceived({});
    setSession([]);
    setManualCounts({});
    setWeekCount(w => w + 1);
    setScreen("home");
  }
  function clearAll() {
    setStock({});
    setReceived({});
    setLastWeek({});
    setSession([]);
    setManualCounts({});
    setWeekCount(1);
    try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    setScreen("home");
  }
  const goHome = () => setScreen("home");

  return h(React.Fragment, null,
    screen === "home" && h(Home, { onNavigate: setScreen, onClearAll: clearAll }),
    screen === "stock" && h(StockScreen, { master: MASTER_DATA, stock, setStock, onHome: goHome }),
    screen === "received" && h(ReceivedScreen, { master: MASTER_DATA, received, setReceived, onHome: goHome }),
    screen === "speedline" && h(SpeedlineScreen, { session, setSession, onHome: goHome }),
    screen === "speedlineoutput" && h(SpeedlineOutputScreen, { master: MASTER_DATA, session, onHome: goHome }),
    screen === "manualvsspeedline" && h(ManualVsSpeedlineScreen, { master: MASTER_DATA, manualCounts, setManualCounts, session, onHome: goHome }),
    screen === "depletion" && h(DepletionScreen, { master: MASTER_DATA, stock, received, lastWeek, session, onCloseWeek: closeWeek, onHome: goHome })
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
